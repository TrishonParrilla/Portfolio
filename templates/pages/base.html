{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}
    {% endblock %}
    <title>
        {% block title %}
        {% endblock %}
    </title>
</head>
<body class="site-body">
    <header class="site-header">
        <nav class="navbar">
            <h1 class="brand">Trishon Parrilla</h1>
        </nav>
    </header>

    <main class="main-content">
        <section class="folder-page-shell">
            <div class="folder-tabs" aria-label="Primary navigation">
                <a class="folder-tab about-title{% if request.resolver_match.url_name == 'about_me' %} is-active{% endif %}" href="{% url 'about_me' %}">About Me</a>
                <a class="folder-tab experience-title{% if request.resolver_match.url_name == 'experience' %} is-active{% endif %}" href="{% url 'experience' %}">Experience</a>
                <a class="folder-tab projects-title{% if request.resolver_match.url_name == 'projects_list' %} is-active{% endif %}" href="{% url 'projects_list' %}">Projects</a>
                <a class="folder-tab contact-title{% if request.resolver_match.url_name == 'contact' %} is-active{% endif %}" href="{% url 'contact' %}">Contact</a>
            </div>
            <div class="folder-page-panel {% block page_panel_class %}{% endblock %}">
                {% block content %}
                {% endblock %}
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <p>2024 Trishon Parrilla</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const body = document.body;
            const folderTabs = document.querySelectorAll('.folder-tab');

            body.classList.add('page-is-ready');

            folderTabs.forEach(function (tab) {
                tab.addEventListener('click', function (event) {
                    const href = tab.getAttribute('href');
                    const isModifiedClick = event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0;
                    const isCurrentPage = tab.classList.contains('is-active');

                    if (!href || isModifiedClick || isCurrentPage) {
                        return;
                    }

                    event.preventDefault();
                    body.classList.add('page-is-leaving');

                    window.setTimeout(function () {
                        window.location.href = href;
                    }, 240);
                });
            });
        });
    </script>
</body>
</html>
